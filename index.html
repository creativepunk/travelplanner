<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Day-by-day map, photos and videos for a Thailand trip, 21-28 December.">
<style>
*, *::before, *::after { box-sizing: border-box; }
:root { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; font: 14px/1.5 system-ui, -apple-system, sans-serif; }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>
<title>Thailand Dec 21–28 Trip</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=IBM+Plex+Mono:wght@400;500&family=Public+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Noto+Sans+Thai:wght@400;500&family=Noto+Sans+Devanagari:wght@400;500&family=Noto+Sans+Kannada:wght@400;500&display=swap">
<style>
/* Layout: three panes on a chart table. Itinerary rail (left) drives a nautical-chart map (centre) and a postcard panel (right). Narrow screens: sticky map on top, list below, postcards inline. */
:root {
  --paper: #ECF2F1;      /* chart paper, cool sea-tinted neutral */
  --panel: #F7FAF9;
  --ink: #13262A;
  --muted: #566C6F;
  --rule: #CFDDDB;
  --sea: #D2E5E4;
  --land: #F3F0E6;
  --coast: #A9BFBB;
  --accent: #D68910;     /* marigold: route, active state */
  --accent-ink: #8F5600;
  --accent-wash: #F8E9CF;
  --flight: #3E5A9E;
  --road: #C26A12;
  --boat: #0B7A85;
  --walk: #5B6B6E;
  --display: "Gloock", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  --body: "Public Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --script: "Noto Sans Thai", "Noto Sans Devanagari", "Noto Sans Kannada", var(--body);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0C1517; --panel: #111E21; --ink: #E2EBE9; --muted: #8DA2A3; --rule: #22363A;
    --sea: #0E1D21; --land: #1C2B2D; --coast: #3A5255;
    --accent: #F2A93B; --accent-ink: #F6BD62; --accent-wash: #3A2C14;
    --flight: #93AAEB; --road: #EE9A45; --boat: #4CC3CB; --walk: #A3B3B5;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0C1517; --panel: #111E21; --ink: #E2EBE9; --muted: #8DA2A3; --rule: #22363A;
  --sea: #0E1D21; --land: #1C2B2D; --coast: #3A5255;
  --accent: #F2A93B; --accent-ink: #F6BD62; --accent-wash: #3A2C14;
  --flight: #93AAEB; --road: #EE9A45; --boat: #4CC3CB; --walk: #A3B3B5;
  color-scheme: dark;
}

html, body { height: 100%; }
/* The page follows the time of day of the selected stop: day (light), dusk (sunrise/sunset), night (dark). */
:root[data-tod="day"] {
  --paper: #ECF2F1; --panel: #F7FAF9; --ink: #13262A; --muted: #566C6F; --rule: #CFDDDB;
  --sea: #D2E5E4; --land: #F3F0E6; --coast: #A9BFBB;
  --accent: #D68910; --accent-ink: #8F5600; --accent-wash: #F8E9CF;
  --flight: #3E5A9E; --road: #C26A12; --boat: #0B7A85; --walk: #5B6B6E;
  color-scheme: light;
}
:root[data-tod="dusk"] {
  --paper: #2E2A3D; --panel: #383349; --ink: #F4EEF2; --muted: #C3B8CB; --rule: #4E4662;
  --sea: #3B3A57; --land: #534B60; --coast: #786C88;
  --accent: #FFB35C; --accent-ink: #FFC985; --accent-wash: #56423E;
  --flight: #B9C5FF; --road: #FFB06A; --boat: #7ED7DD; --walk: #CDC2D4;
  color-scheme: dark;
}
:root[data-tod="night"] {
  --paper: #0C1517; --panel: #111E21; --ink: #E2EBE9; --muted: #8DA2A3; --rule: #22363A;
  --sea: #0E1D21; --land: #1C2B2D; --coast: #3A5255;
  --accent: #F2A93B; --accent-ink: #F6BD62; --accent-wash: #3A2C14;
  --flight: #93AAEB; --road: #EE9A45; --boat: #4CC3CB; --walk: #A3B3B5;
  color-scheme: dark;
}
body { background: var(--paper); color: var(--ink); font: 15px/1.5 var(--body); }
body, .top, .list, .photos, .dayhead, .mapwrap, .stop, .nb, .opt, .btn, .chip, .node, .stay, .leginfo, .legend, .night { transition: background-color .7s ease, color .7s ease, border-color .7s ease; }
#base rect, #base path { transition: fill .7s ease, stroke .7s ease; }
.todchip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 11px; border-radius: 999px; border: 1px solid var(--rule); font: 500 12px var(--mono); color: var(--muted); background: var(--panel); white-space: nowrap; }
.todchip svg { width: 14px; height: 14px; color: var(--accent); }
.daystrip { position: relative; width: 84px; height: 8px; border-radius: 4px; border: 1px solid var(--rule); margin-left: 4px; }
.daystrip i { position: absolute; top: -4px; width: 3px; height: 14px; margin-left: -1.5px; border-radius: 2px; background: var(--accent); box-shadow: 0 0 0 1.5px var(--panel); transition: left .7s ease; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--sea); }
button { font: inherit; color: inherit; }
a { color: var(--accent-ink); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[lang="th"], [lang="hi"], [lang="kn"] { font-family: var(--script); }

.app { display: flex; flex-direction: column; height: 100%; }

/* Header */
.top {
  display: flex; flex-wrap: wrap; align-items: center; gap: 12px 28px;
  padding-block: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--panel); border-bottom: 1px solid var(--rule);
}
.brand h1 { margin: 0; font: 400 1.65rem/1.05 var(--display); letter-spacing: 0.005em; text-wrap: balance; }
.brand p { margin: 4px 0 0; font: 12px/1.3 var(--mono); color: var(--muted); }
.opts { display: flex; gap: 8px; flex-wrap: wrap; }
.opt {
  display: grid; gap: 1px; text-align: left; cursor: pointer;
  padding: 7px 12px 8px; border-radius: 10px;
  border: 1px solid var(--rule); background: var(--paper);
}
.opt b { font-weight: 600; font-size: 14px; }
.opt span { font: 11.5px/1.3 var(--mono); color: var(--muted); }
.opt[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-wash); }
.opt[aria-pressed="true"] span { color: var(--accent-ink); }
.tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-left: auto; }
.btn {
  display: inline-flex; align-items: center; gap: 6px; cursor: pointer; text-decoration: none;
  padding: 7px 12px; border-radius: 999px; border: 1px solid var(--rule); background: var(--panel);
  font-size: 13px; font-weight: 500; color: var(--ink); white-space: nowrap;
}
.btn:hover { border-color: var(--accent); }
.btn svg { width: 14px; height: 14px; }
.btn[aria-pressed="true"] { background: var(--ink); color: var(--panel); border-color: var(--ink); }

/* Panes */
.panes { flex: 1; min-height: 0; display: grid; grid-template-columns: var(--wl, 390px) 8px minmax(0, 1fr) 8px var(--wr, 360px); }
.gutter { position: relative; cursor: col-resize; background: var(--paper); touch-action: none; z-index: 4; }
.gutter::after { content: ""; position: absolute; top: 50%; left: 50%; width: 4px; height: 44px; translate: -50% -50%; border-radius: 4px; background: var(--rule); transition: background-color .2s; }
.gutter:hover::after, .gutter.drag::after, .gutter:focus-visible::after { background: var(--accent); }
.maphandle { display: none; }
.list { overflow-y: auto; overscroll-behavior: contain; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 16px; padding-block: 0 40vh; min-width: 0; }
.mapwrap { position: relative; min-width: 0; min-height: 0; background: var(--sea); overflow: hidden; cursor: grab; touch-action: none; }
.mapwrap.panning { cursor: grabbing; }
.mapui-zoom { position: absolute; right: 12px; bottom: 34px; z-index: 3; display: grid; gap: 6px; justify-items: end; }
.zbtn { width: 34px; height: 34px; border-radius: 9px; border: 1px solid var(--rule); background: var(--panel); color: var(--ink); cursor: pointer; display: grid; place-items: center; font: 500 18px/1 var(--body); }
.zbtn:hover { border-color: var(--accent); }
.recenter { height: 34px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--accent); background: var(--accent); color: #1B1406; cursor: pointer; font: 600 12.5px var(--body); display: inline-flex; align-items: center; gap: 6px; box-shadow: 0 2px 10px rgb(0 0 0 / .18); }
.recenter svg { width: 14px; height: 14px; }
.photos { overflow-y: auto; background: var(--panel); padding-left: 20px; padding-right: max(20px, env(safe-area-inset-right, 0px)); padding-block: 20px 32px; min-width: 0; }

/* Days and stops */
.day { padding-top: 6px; }
.dayhead {
  position: sticky; top: 0; z-index: 2; background: var(--paper);
  padding-block: 14px 10px; border-bottom: 1px solid var(--rule);
  display: grid; grid-template-columns: auto 1fr; column-gap: 10px; align-items: baseline;
}
.dnum { font: 500 11px/1 var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent-ink); }
.ddate { font: 11px/1 var(--mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); text-align: right; }
.dayhead h2 { grid-column: 1 / -1; margin: 6px 0 0; font: 400 1.3rem/1.15 var(--display); text-wrap: balance; }
.stay { grid-column: 1 / -1; margin-top: 8px; display: grid; grid-template-columns: auto minmax(0, 1fr); column-gap: 8px; align-items: start;
  padding: 7px 10px; border-radius: 9px; background: var(--accent-wash); color: var(--ink); font-size: 13px; line-height: 1.35; }
.stay svg { width: 16px; height: 16px; margin-top: 1px; color: var(--accent-ink); }
.stay b { font-weight: 600; }
.stay small { display: block; color: var(--muted); font-size: 12px; margin-top: 1px; }
.pc-stay { margin-top: 14px; padding: 10px 12px; border-radius: 10px; background: var(--accent-wash); display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 10px; font-size: 13.5px; }
.pc-stay svg { width: 18px; height: 18px; color: var(--accent-ink); grid-row: span 3; margin-top: 2px; }
.pc-stay .k { font: 500 10.5px/1.4 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--accent-ink); }
.pc-stay b { font-weight: 600; }
.pc-stay small { color: var(--muted); font-size: 12.5px; }
.stops { list-style: none; margin: 0; padding: 8px 0 0; position: relative; }
.stops::before { content: ""; position: absolute; left: 67px; top: 18px; bottom: 18px; width: 0; border-left: 1.5px dashed var(--rule); }
.stop {
  display: grid; grid-template-columns: 50px 34px minmax(0, 1fr); column-gap: 0;
  padding: 10px 8px 10px 0; border-radius: 12px; cursor: pointer; position: relative;
}
.stop:hover .body h3 { color: var(--accent-ink); }
.time { font: 500 12px/1.2 var(--mono); color: var(--muted); padding-top: 6px; font-variant-numeric: tabular-nums; }
.time small { display: block; font-size: 10px; font-weight: 400; margin-top: 2px; }
.rail { display: flex; justify-content: center; padding-top: 2px; }
.node {
  width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center;
  background: var(--panel); border: 1.5px solid var(--m, var(--muted)); color: var(--m, var(--muted)); position: relative; z-index: 1;
}
.node svg { width: 14px; height: 14px; }
.body { min-width: 0; padding-left: 8px; }
.body h3 { margin: 2px 0 0; font-size: 15.5px; font-weight: 600; line-height: 1.3; }
.local { display: block; font-size: 12.5px; font-weight: 400; color: var(--muted); margin-top: 1px; }
.body p { margin: 5px 0 0; font-size: 14px; color: var(--ink); max-width: 60ch; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 7px; }
.chip { font: 11.5px/1.2 var(--mono); padding: 3px 7px; border-radius: 6px; background: var(--panel); border: 1px solid var(--rule); color: var(--muted); }
.stop.on { background: var(--panel); box-shadow: 0 0 0 1px var(--rule); }
.stop.on .node { background: var(--m, var(--accent)); color: var(--panel); border-color: var(--m, var(--accent)); }
.stop.on .time { color: var(--accent-ink); }
.night {
  margin: 4px 0 6px 50px; padding: 8px 12px; border-radius: 10px;
  font-size: 13px; color: var(--muted); display: flex; gap: 8px; align-items: center;
}
.night svg { width: 14px; height: 14px; flex: none; }
.night b { color: var(--ink); font-weight: 600; }
.listfoot { margin: 24px 0 0 50px; font-size: 13px; color: var(--muted); }

/* Map */
#base, #overlay { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#overlay { pointer-events: none; }
#overlay .hit { pointer-events: auto; cursor: pointer; }
.mapui-tl, .mapui-tr, .mapui-bl, .mapui-br { position: absolute; display: flex; gap: 6px; flex-wrap: wrap; z-index: 3; }
.mapui-tl { top: 12px; left: 12px; max-width: calc(100% - 180px); }
.mapui-tr { top: 12px; right: 12px; }
.mapui-bl { bottom: 12px; left: 12px; }
.mapui-br { bottom: 10px; right: 12px; font: 10.5px var(--mono); color: var(--muted); }
.legend { display: flex; gap: 10px; flex-wrap: wrap; padding: 6px 10px; border-radius: 8px; background: color-mix(in srgb, var(--panel) 88%, transparent); border: 1px solid var(--rule); font: 11px var(--mono); color: var(--muted); }
.legend i { display: inline-block; width: 18px; height: 0; border-top: 2px solid; vertical-align: middle; margin-right: 5px; }
.legend .lf { border-color: var(--flight); border-top-style: dashed; }
.legend .lr { border-color: var(--road); }
.legend .lb { border-color: var(--boat); border-top-style: dotted; border-top-width: 3px; }
.legend .lw { border-color: var(--walk); border-top-style: dotted; }
.scalebar { font: 10.5px var(--mono); color: var(--muted); }
.scalebar div { height: 6px; border: 1.5px solid var(--muted); border-top: 0; margin-bottom: 3px; }
.leginfo { padding: 8px 12px; border-radius: 10px; background: color-mix(in srgb, var(--panel) 92%, transparent); border: 1px solid var(--rule); font-size: 13px; max-width: 300px; }
.leginfo .lk { font: 500 10.5px/1 var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.leginfo .lv { margin-top: 4px; font-weight: 600; }

/* Postcard panel */
.pc-eyebrow { font: 500 11px/1.2 var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent-ink); }
.pc-photo { margin-top: 12px; position: relative; border-radius: 14px; overflow: hidden; aspect-ratio: 4 / 3; max-width: 100%; background: var(--sea); }
.pc-photo img { width: 100%; height: 100%; object-fit: cover; display: block; transition: opacity .35s; }
.pc-fallback { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 20px;
  background: repeating-linear-gradient(170deg, var(--sea) 0 14px, color-mix(in srgb, var(--sea) 80%, var(--coast)) 14px 15px); }
.pc-fallback div { font-size: 2rem; line-height: 1.3; color: var(--ink); }
.pc-fallback small { display: block; margin-top: 6px; font: 11px var(--mono); color: var(--muted); }
.pc-name { margin: 14px 0 0; font: 400 1.75rem/1.1 var(--display); text-wrap: balance; }
.pc-local { margin-top: 4px; font-size: 15px; color: var(--muted); }
.pc-text { margin: 10px 0 0; font-size: 14.5px; max-width: 60ch; }
.pc-facts { margin: 14px 0 0; display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; font-size: 13px; }
.pc-facts dt { font: 11px/1.6 var(--mono); text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
.pc-facts dd { margin: 0; font-variant-numeric: tabular-nums; }
.pc-links { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
.pc-credit { margin-top: 10px; font-size: 11.5px; color: var(--muted); }
.pc-credit a { color: var(--muted); }
.strip-h { margin: 22px 0 8px; font: 500 11px/1 var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.pgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.pgrid button { padding: 0; border: 0; border-radius: 8px; overflow: hidden; aspect-ratio: 1; background: var(--sea); cursor: pointer; position: relative; }
.pgrid img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .3s ease; }
.pgrid button:hover img { transform: scale(1.05); }
.pgrid .more { position: absolute; inset: 0; display: grid; place-items: center; background: rgb(8 14 16 / .55); color: #fff; font: 600 15px var(--body); }
.vids { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.vid { position: relative; padding: 0; border: 0; border-radius: 10px; overflow: hidden; background: #000; cursor: pointer; aspect-ratio: 16 / 9; grid-column: 1 / -1; }
.vid.s { aspect-ratio: 9 / 16; grid-column: auto; }
.vid img { width: 100%; height: 100%; object-fit: cover; display: block; opacity: .9; }
.vid iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.vid .play { position: absolute; left: 50%; top: 50%; translate: -50% -50%; width: 54px; height: 38px; border-radius: 10px; background: #E5322D; display: grid; place-items: center; }
.vid .play::after { content: ""; border-left: 14px solid #fff; border-top: 9px solid transparent; border-bottom: 9px solid transparent; margin-left: 3px; }
.vid .vt { position: absolute; left: 0; right: 0; bottom: 0; padding: 18px 10px 8px; background: linear-gradient(transparent, rgb(0 0 0 / .75)); color: #fff; font: 500 12px/1.3 var(--body); text-align: left; }
.insta { display: grid; gap: 10px; }
.insta blockquote { margin: 0 !important; min-width: 0 !important; width: 100% !important; }
.reels { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.reel { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 10px; align-items: center; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--rule); background: var(--paper); text-decoration: none; color: var(--ink); }
.reel:hover { border-color: var(--accent); }
.reel svg { width: 26px; height: 26px; grid-row: span 2; }
.reel.yt svg { color: #E5322D; } .reel.ig svg { color: #C13584; }
.reel b { font-size: 13px; font-weight: 600; line-height: 1.2; }
.reel small { font: 11.5px var(--mono); color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.inline-extra { display: none; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.inline-extra a, .inline-extra button { font: 500 12px var(--body); padding: 5px 10px; border-radius: 999px; border: 1px solid var(--rule); background: var(--panel); color: var(--ink); text-decoration: none; cursor: pointer; }
.near { display: grid; gap: 10px; }
.nb { display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 12px; padding: 8px; border-radius: 12px; border: 1px solid var(--rule); background: var(--paper); }
.nb.np { grid-template-columns: minmax(0, 1fr); padding: 10px 12px; }
.nb-ph { padding: 0; border: 0; border-radius: 8px; overflow: hidden; aspect-ratio: 1; background: var(--sea); cursor: pointer; position: relative; display: grid; place-items: center; }
.nb-ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
.nb-ph span.n { position: absolute; right: 4px; bottom: 4px; padding: 1px 6px; border-radius: 999px; background: rgb(12 21 23 / .65); color: #fff; font: 10.5px var(--mono); }
.nb-ph svg { width: 22px; height: 22px; color: var(--muted); }
.nb-ph:disabled { cursor: default; }
.nb h4 { margin: 0; font-size: 14px; font-weight: 600; line-height: 1.3; }
.nb-d { margin-top: 2px; font: 11.5px var(--mono); color: var(--accent-ink); font-variant-numeric: tabular-nums; }
.nb p { margin: 4px 0 0; font-size: 13px; line-height: 1.45; color: var(--ink); }
.nb a { display: inline-block; margin-top: 4px; font-size: 12px; }
.near-note { margin: 8px 0 0; font-size: 11.5px; color: var(--muted); }

/* Carousel (panel) */
.car { margin-top: 12px; }
.car-stage { position: relative; border-radius: 14px; overflow: hidden; aspect-ratio: 4 / 3; max-width: 100%; background: var(--sea); touch-action: pan-y; user-select: none; }
.car-track { display: flex; height: 100%; transition: transform .45s cubic-bezier(.2,.7,.2,1); }
.car-track img { flex: 0 0 100%; width: 100%; height: 100%; object-fit: cover; display: block; -webkit-user-drag: none; }
.car-nav { position: absolute; top: 50%; translate: 0 -50%; width: 36px; height: 36px; border-radius: 50%; border: 0; cursor: pointer;
  display: grid; place-items: center; background: rgb(12 21 23 / .55); color: #fff; }
.car-nav:hover { background: rgb(12 21 23 / .8); }
.car-nav svg { width: 16px; height: 16px; }
.car-prev { left: 10px; } .car-next { right: 10px; }
.car-fs { position: absolute; top: 10px; right: 10px; height: 32px; padding: 0 10px; border-radius: 999px; border: 0; cursor: pointer;

/* ---------- Time of day drives the page colours ---------- */

  [4.5,  "#0C1517", "#111E21", "#0E1D21", "#1C2B2D", "#3A5255"],
  [5.3,  "#17182C", "#1F2036", "#1B1D37", "#2A2942", "#45436B"],   // pre-dawn
  [6.4,  "#56425E", "#624C69", "#655A7E", "#7E6679", "#A48799"],   // dawn
  [7.2,  "#F2E6DC", "#FBF3EC", "#E3DDE3", "#F6EBDD", "#C9B6AD"],   // sunrise light
  [9,    "#ECF2F1", "#F7FAF9", "#D2E5E4", "#F3F0E6", "#A9BFBB"],   // day
  [15,   "#ECF2F1", "#F7FAF9", "#D2E5E4", "#F3F0E6", "#A9BFBB"],
  [16.5, "#F2ECDF", "#FBF7EE", "#DCE2D6", "#F5ECD8", "#BDB49A"],   // afternoon
  [17.6, "#EED3B0", "#F7E3C8", "#E2C6A6", "#F2DCBC", "#C49E78"],   // golden hour
  [18,   "#3B2F4B", "#463956", "#4A3F63", "#5E4C66", "#86708E"],   // dusk
  [19.3, "#141A2B", "#1A2236", "#15203A", "#232D40", "#3F4D6A"],   // blue hour
  [21,   "#0C1517", "#111E21", "#0E1D21", "#1C2B2D", "#3A5255"],

/* ---------- Map view ---------- */
let W = 800, H = 600;
let view = { cx: 500, cy: 420, w: 1000 };   // centre + width in map units; height from aspect
let anim = null;            // current animation
let legT = 1;               // drawing progress of the active leg

function sizeMap() {
  const r = mapwrap.getBoundingClientRect();
  W = Math.max(50, r.width); H = Math.max(50, r.height);
  overlay.setAttribute("viewBox", `0 0 ${W} ${H}`);
  render();
}
new ResizeObserver(sizeMap).observe(mapwrap);

  for (const [x, y] of pts) { x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y); }

  // Include the rest of the day so the frame doesn't jump around between nearby stops.
  stops.filter(x => x.di === s.di).forEach(x => { if (x.m !== "flight" || x.i === i) pts.push([x.place.x, x.place.y]); });

}
function partial(g, t) {
  // Return path string for the first t of the leg, and the point at t.
  if (g.C) {
    const { A, B, C } = g;
    const lerp = (p, q, u) => [p[0] + (q[0] - p[0]) * u, p[1] + (q[1] - p[1]) * u];
    const P1 = lerp(A, C, t), P2 = lerp(C, B, t), P = lerp(P1, P2, t);
    return { d: `M${A[0].toFixed(1)},${A[1].toFixed(1)}Q${P1[0].toFixed(1)},${P1[1].toFixed(1)} ${P[0].toFixed(1)},${P[1].toFixed(1)}`, P };
  }
  const P = [g.A[0] + (g.B[0] - g.A[0]) * t, g.A[1] + (g.B[1] - g.A[1]) * t];
  return { d: `M${g.A[0].toFixed(1)},${g.A[1].toFixed(1)}L${P[0].toFixed(1)},${P[1].toFixed(1)}`, P };
}
const DASH = { flight: "7 6", boat: "2 5", walk: "1 4", bus: "", car: "", start: "" };

function niceStep(spanDeg) {
  const c = [10, 5, 2, 1, 0.5, 0.25, 1 / 6, 0.1, 1 / 20, 1 / 60];
  for (const s of c) if (spanDeg / s >= 3) return s;
  return 1 / 60;
}
function niceKm(km) {
  const c = [1, 2, 5, 10, 20, 50, 100, 200, 500, 1000];
  for (let i = c.length - 1; i >= 0; i--) if (c[i] <= km) return c[i];
  return 1;
}

function render() {
  const vb = vbox();
  base.setAttribute("viewBox", `${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
  const k = W / vb.w;
  const toPx = (x, y) => [(x - vb.x) * k, (y - vb.y) * k];
  const col = {
    flight: cssVar("--flight"), bus: cssVar("--road"), car: cssVar("--road"), boat: cssVar("--boat"),
    walk: cssVar("--walk"), start: cssVar("--accent"), accent: cssVar("--accent"), ink: cssVar("--ink"),
    muted: cssVar("--muted"), sea: cssVar("--sea"), panel: cssVar("--panel"), rule: cssVar("--rule"), coast: cssVar("--coast")
  };
  let s = "";

  // Graticule with degree-minute labels (chart convention)
  const [latTop, lonLeft] = unproj(vb.x, vb.y), [latBot, lonRight] = unproj(vb.x + vb.w, vb.y + vb.h);
  const step = niceStep(Math.min(lonRight - lonLeft, latTop - latBot));
  let g = "", gl = "";
  for (let lo = Math.ceil(lonLeft / step) * step; lo <= lonRight; lo += step) {
    const [px] = toPx(proj(0, lo)[0], 0);
    g += `M${px.toFixed(1)},0V${H}`;
    gl += `<text x="${(px + 4).toFixed(1)}" y="${H - 34}" class="gt">${dm(lo, "E", "W")}</text>`;
  }
  for (let la = Math.ceil(latBot / step) * step; la <= latTop; la += step) {
    const py = toPx(0, proj(la, 0)[1])[1];
    g += `M0,${py.toFixed(1)}H${W}`;
    gl += `<text x="${W - 6}" y="${(py - 4).toFixed(1)}" class="gt" text-anchor="end">${dm(la, "N", "S")}</text>`;
  }
  s += `<path d="${g}" stroke="${col.coast}" stroke-opacity=".45" stroke-width=".6" fill="none"/>`;
  s += `<g style="font: 10px var(--mono); fill: ${col.muted}; opacity: .85">${gl}</g>`;

  // Sea names
  const SEAS = [["Bay of Bengal", 15.5, 88.5, 60, 4000], ["Andaman Sea", 10.6, 96.6, 8, 4000], ["Gulf of Thailand", 11.2, 101.3, 8, 4000], ["Phang Nga Bay", 8.19, 98.57, 0.05, 2.2]];
  const spanDeg = lonRight - lonLeft;
  for (const [name, la, lo, minS, maxS] of SEAS) {
    if (spanDeg < minS * 0.25 || spanDeg > maxS) continue;
    const [px, py] = toPx(...proj(la, lo));
    if (px < -50 || px > W + 50 || py < -20 || py > H + 20) continue;
    s += `<text x="${px.toFixed(1)}" y="${py.toFixed(1)}" text-anchor="middle" style="font: italic 13px var(--body); letter-spacing: .14em; fill: ${col.muted}; opacity: .8">${esc(name.toUpperCase())}</text>`;
  }

  // Legs
  const cur = stops[active];
  let mover = null;
  for (let i = 1; i < stops.length; i++) {
    const a = stops[i - 1].place, b = stops[i].place, m = stops[i].m;
    if (a === b || m === "start") continue;
    const geo = legGeom(a, b, m, k, toPx);
    const c = col[m] || col.ink;
    const dash = DASH[m] ? `stroke-dasharray="${DASH[m]}"` : "";
    if (i < active || (i === active && legT >= 1) || wholeRoute) {
      const full = partial(geo, 1);
      s += `<path d="${full.d}" fill="none" stroke="${c}" stroke-width="${i === active && !wholeRoute ? 3.2 : 2.2}" stroke-linecap="round" ${dash} opacity="${i === active || wholeRoute ? 1 : .75}"/>`;
    } else if (i === active) {
      const full = partial(geo, 1);
      s += `<path d="${full.d}" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" ${dash} opacity=".25"/>`;
      const p = partial(geo, Math.max(0.001, legT));
      s += `<path d="${p.d}" fill="none" stroke="${c}" stroke-width="3.2" stroke-linecap="round" ${dash}/>`;
      mover = { P: p.P, c, m };
    } else {
      const full = partial(geo, 1);
      s += `<path d="${full.d}" fill="none" stroke="${col.muted}" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="${DASH[m] || "5 4"}" opacity=".45"/>`;
    }
  }

  // Markers (unique places)
  const seen = new Map();
  stops.forEach(st => { if (!seen.has(st.place.id)) seen.set(st.place.id, st); });
  const dayPlaces = new Set(stops.filter(x => x.di === cur.di).map(x => x.place.id));
  const labels = [];
  for (const [id, st] of seen) {
    const p = st.place, [px, py] = toPx(p.x, p.y);
    if (px < -40 || px > W + 40 || py < -40 || py > H + 40) continue;
    const isCur = id === cur.place.id && !wholeRoute;
    const inDay = dayPlaces.has(id);
    const r = isCur ? 7 : inDay ? 5 : 3.6;
    if (isCur) s += `<circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="16" fill="${col.accent}" opacity=".18"/>`;
    s += `<circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="${r}" fill="${isCur ? col.accent : (inDay ? col.panel : col.panel)}" stroke="${isCur ? col.ink : (inDay ? col.ink : col.muted)}" stroke-width="${isCur ? 2 : 1.4}"/>`;
    if (p.stay && !isCur) s += `<circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="${r + 3}" fill="none" stroke="${col.muted}" stroke-width="1"/>`;
    s += `<circle class="hit" data-place="${id}" cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="14" fill="transparent"><title>${esc(p.n)}</title></circle>`;
    if (isCur || inDay || wholeRoute) labels.push({ px, py, text: p.n, cur: isCur, r });
  }
  // Labels with simple collision avoidance, current first
  labels.sort((a, b) => b.cur - a.cur);
  const boxes = [];
  for (const L of labels) {
    const fs = L.cur ? 14 : 12;
    const w = L.text.length * fs * 0.56, h = fs + 4;
    const cands = [[L.px + L.r + 6, L.py + fs * 0.35, "start"], [L.px - L.r - 6, L.py + fs * 0.35, "end"], [L.px, L.py - L.r - 8, "middle"], [L.px, L.py + L.r + fs + 4, "middle"]];
    let placed = null;
    for (const [x, y, anchor] of cands) {
      const bx = anchor === "start" ? x : anchor === "end" ? x - w : x - w / 2;
      const box = [bx, y - fs, bx + w, y + 4];
      if (box[0] < 4 || box[2] > W - 4 || box[1] < 4 || box[3] > H - 4) continue;
      if (boxes.some(b => !(box[2] < b[0] || box[0] > b[2] || box[3] < b[1] || box[1] > b[3]))) continue;
      placed = { x, y, anchor, box }; break;
    }
    if (!placed) continue;
    boxes.push(placed.box);
    s += `<text x="${placed.x.toFixed(1)}" y="${placed.y.toFixed(1)}" text-anchor="${placed.anchor}" style="font: ${L.cur ? 600 : 500} ${fs}px var(--body); fill: ${col.ink}; paint-order: stroke; stroke: ${col.sea}; stroke-width: 4px; stroke-linejoin: round">${esc(L.text)}</text>`;
  }

  // Nearby places for the current stop: small diamonds, labelled when there is room
  if (!wholeRoute) {
    for (const q of NEARBY[cur.place.id] || []) {
      const [px, py] = toPx(q.x0, q.y0);
      if (px < 6 || px > W - 6 || py < 6 || py > H - 6) continue;
      s += `<rect x="${(px - 4).toFixed(1)}" y="${(py - 4).toFixed(1)}" width="8" height="8" transform="rotate(45 ${px.toFixed(1)} ${py.toFixed(1)})" fill="${col.panel}" stroke="${col.accent}" stroke-width="1.6"/>`;
      s += `<circle class="hit" data-near="${q.id}" cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="12" fill="transparent"><title>${esc(q.n)} (nearby)</title></circle>`;
      const fs = 11, w = q.n.length * fs * 0.55;
      for (const [x, y, anchor] of [[px + 9, py + 4, "start"], [px - 9, py + 4, "end"], [px, py - 10, "middle"], [px, py + 18, "middle"]]) {
        const bx = anchor === "start" ? x : anchor === "end" ? x - w : x - w / 2;
        const box = [bx, y - fs, bx + w, y + 3];
        if (box[0] < 4 || box[2] > W - 4 || box[1] < 4 || box[3] > H - 4) continue;
        if (boxes.some(b => !(box[2] < b[0] || box[0] > b[2] || box[3] < b[1] || box[1] > b[3]))) continue;
        boxes.push(box);
        s += `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="${anchor}" style="font: italic 500 ${fs}px var(--body); fill: ${col.muted}; paint-order: stroke; stroke: ${col.sea}; stroke-width: 3.5px; stroke-linejoin: round">${esc(q.n)}</text>`;
        break;
      }
    }
  }

  // Moving traveller dot on the active leg
  if (mover) {
    s += `<circle cx="${mover.P[0].toFixed(1)}" cy="${mover.P[1].toFixed(1)}" r="9" fill="${mover.c}" opacity=".25"/>`;
    s += `<circle cx="${mover.P[0].toFixed(1)}" cy="${mover.P[1].toFixed(1)}" r="4.5" fill="${mover.c}" stroke="${col.panel}" stroke-width="1.5"/>`;
  }
  overlay.innerHTML = s;

  // Scale bar
  const midLat = unproj(view.cx, view.cy)[0];
  const kmPerPx = (vb.w / W) * 6371 * Math.cos(midLat * Math.PI / 180) / PJ.scale;
  const km = niceKm(kmPerPx * 110);
  const sb = $("#scalebar");
  sb.firstElementChild.style.width = (km / kmPerPx).toFixed(0) + "px";
  sb.lastElementChild.textContent = `${km} km`;
}
mapwrap.addEventListener("click", e => {
  if (dragMoved >= 4 || (e.target.closest && e.target.closest(".hit"))) return;
  // Pointer capture retargets clicks to the map container, so find a marker under the pointer.
  const el = document.elementsFromPoint(e.clientX, e.clientY).find(n => n.classList && n.classList.contains("hit"));
  if (el) { e.stopPropagation(); el.dispatchEvent(new MouseEvent("click", { bubbles: true })); }
});
overlay.addEventListener("click", e => {
  if (dragMoved >= 4) return;
  const h = e.target.closest(".hit"); if (!h) return;
  if (h.dataset.near) { stopPlay(); openNear(h.dataset.near); return; }
  stopPlay();
  const id = h.dataset.place;
  // Prefer the next visit of this place after the current stop, else the first visit.
  const after = stops.find(s => s.place.id === id && s.i > active);
  const first = stops.find(s => s.place.id === id);
  setActive((after || first).i, { scroll: true });
});

/* ---------- Pan and zoom ---------- */
let freeView = false;
function showRecenter() { $("#recenter").hidden = !freeView; }
function goFree() { if (anim) { cancelAnimationFrame(anim.raf); anim = null; legT = 1; } freeView = true; showRecenter(); }
const ptrs = new Map();
let panStart = null, pinchStart = null, dragMoved = 0;
mapwrap.addEventListener("pointerdown", e => {
  if (e.target.closest(".mapui-zoom, .mapui-tl, .mapui-tr, .maphandle, .legend")) return;
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  mapwrap.setPointerCapture(e.pointerId);
  dragMoved = 0;
  if (ptrs.size === 1) panStart = { x: e.clientX, y: e.clientY, cx: view.cx, cy: view.cy };
  if (ptrs.size === 2) {
    const [a, b] = [...ptrs.values()];
    pinchStart = { d: Math.hypot(a.x - b.x, a.y - b.y), w: view.w, cx: view.cx, cy: view.cy, mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2 };
    panStart = null;
  }
});
mapwrap.addEventListener("pointermove", e => {
  if (!ptrs.has(e.pointerId)) return;
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  const k = view.w / W;
  if (panStart && ptrs.size === 1) {
    const dx = e.clientX - panStart.x, dy = e.clientY - panStart.y;
    dragMoved = Math.max(dragMoved, Math.hypot(dx, dy));
    if (dragMoved < 4) return;
    if (!freeView) { goFree(); }
    stopPlay();
    mapwrap.classList.add("panning");
    view = { ...view, cx: panStart.cx - dx * k, cy: panStart.cy - dy * k };
    render();
  } else if (pinchStart && ptrs.size === 2) {
    const [a, b] = [...ptrs.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y);
    if (!freeView) goFree();
    dragMoved = 99;
    const w = Math.min(1400, Math.max(1.2, pinchStart.w * pinchStart.d / Math.max(d, 1)));
    view = { cx: pinchStart.cx, cy: pinchStart.cy, w };
    render();
  }
});
function endPtr(e) { ptrs.delete(e.pointerId); if (ptrs.size < 2) pinchStart = null; if (!ptrs.size) { panStart = null; mapwrap.classList.remove("panning"); } }
mapwrap.addEventListener("pointerup", endPtr);
mapwrap.addEventListener("pointercancel", endPtr);
function zoomAt(f, px, py) {
  if (!freeView) goFree();
  const r = mapwrap.getBoundingClientRect();
  const ux = (px ?? r.width / 2), uy = (py ?? r.height / 2);
  const vb = vbox();
  const mx = vb.x + ux * vb.w / W, my = vb.y + uy * vb.h / H;
  const w = Math.min(1400, Math.max(1.2, view.w * f));
  const s = w / view.w;
  view = { w, cx: mx + (view.cx - mx) * s, cy: my + (view.cy - my) * s };
  render();
}
mapwrap.addEventListener("wheel", e => {
  e.preventDefault();
  const r = mapwrap.getBoundingClientRect();
  zoomAt(Math.exp(e.deltaY * 0.0016), e.clientX - r.left, e.clientY - r.top);
}, { passive: false });
$("#zin").addEventListener("click", () => zoomAt(1 / 1.5));
$("#zout").addEventListener("click", () => zoomAt(1.5));
$("#recenter").addEventListener("click", () => { freeView = false; showRecenter(); flyTo(wholeRoute ? wholeView() : viewForStop(active), false); });

/* ---------- Resizable panels ---------- */
const panes = $(".panes");
function loadSizes() {
  try {
    const s = JSON.parse(localStorage.getItem("trip-panes") || "{}");
    if (s.wl) panes.style.setProperty("--wl", s.wl + "px");
    if (s.wr) panes.style.setProperty("--wr", s.wr + "px");
    if (s.mh) document.documentElement.style.setProperty("--maph", s.mh + "px");
  } catch (_) {}
}
function saveSizes() {
  try {
    localStorage.setItem("trip-panes", JSON.stringify({
      wl: parseFloat(panes.style.getPropertyValue("--wl")) || undefined,
      wr: parseFloat(panes.style.getPropertyValue("--wr")) || undefined,
      mh: parseFloat(document.documentElement.style.getPropertyValue("--maph")) || undefined
    }));
  } catch (_) {}
}
function dragger(el, onMove) {
  el.addEventListener("pointerdown", e => {
    e.preventDefault(); e.stopPropagation();
    el.setPointerCapture(e.pointerId); el.classList.add("drag");
    const move = ev => onMove(ev);
    const up = ev => { el.releasePointerCapture(ev.pointerId); el.classList.remove("drag"); el.removeEventListener("pointermove", move); el.removeEventListener("pointerup", up); saveSizes(); };
    el.addEventListener("pointermove", move); el.addEventListener("pointerup", up);
  });
}
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function widths() { const r = panes.getBoundingClientRect(); const photosShown = getComputedStyle(photosEl).display !== "none"; return { r, wl: listEl.getBoundingClientRect().width, wr: photosShown ? photosEl.getBoundingClientRect().width : 0 }; }
dragger($("#gutL"), e => { const { r, wr } = widths(); panes.style.setProperty("--wl", clamp(e.clientX - r.left, 260, r.width - wr - 320) + "px"); });
dragger($("#gutR"), e => { const { r, wl } = widths(); panes.style.setProperty("--wr", clamp(r.right - e.clientX, 260, r.width - wl - 320) + "px"); });
dragger($("#maphandle"), e => { const top = mapwrap.getBoundingClientRect().top; document.documentElement.style.setProperty("--maph", clamp(e.clientY - top, 160, innerHeight * 0.8) + "px"); });
function keyResize(el, prop, sign) {
  el.addEventListener("keydown", e => {
    if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
    e.preventDefault(); e.stopPropagation();
    const cur = (prop === "--wl" ? listEl : photosEl).getBoundingClientRect().width;
    panes.style.setProperty(prop, clamp(cur + (e.key === "ArrowRight" ? 24 : -24) * sign, 260, 760) + "px");
    saveSizes();
  });
  el.addEventListener("dblclick", () => { panes.style.removeProperty(prop); saveSizes(); });
}
keyResize($("#gutL"), "--wl", 1);
keyResize($("#gutR"), "--wr", -1);
loadSizes();

/* ---------- Whole route / Play ---------- */
function setWhole(on, animate = true) {
  wholeRoute = on;
  if (animate) { freeView = false; showRecenter(); }
  $("#whole").setAttribute("aria-pressed", String(on));
  renderLegInfo();
  if (animate) flyTo(on ? wholeView() : viewForStop(active), false);
}
$("#whole").addEventListener("click", () => { stopPlay(); setWhole(!wholeRoute); });

let playTimer = 0;
function stopPlay() {
  if (!playTimer) return;
  clearInterval(playTimer); playTimer = 0;
  $("#play").setAttribute("aria-pressed", "false");
  $("#play span").textContent = "Play trip";
}
$("#play").addEventListener("click", () => {
  if (playTimer) { stopPlay(); return; }
  if (active >= stops.length - 1) setActive(0, { scroll: true });
  $("#play").setAttribute("aria-pressed", "true");
  $("#play span").textContent = "Pause";
  playTimer = setInterval(() => {
    if (active >= stops.length - 1) { stopPlay(); return; }
    setActive(active + 1, { scroll: true });
  }, 3200);
});
["wheel", "touchstart"].forEach(ev => listEl.addEventListener(ev, stopPlay, { passive: true }));

addEventListener("keydown", e => {
  if (e.target && e.target.closest && e.target.closest("input, textarea, select")) return;
  if (!lb.hidden) {
    if (e.key === "Escape") { e.preventDefault(); closeLightbox(); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); lbShow(lbIdx - 1); }
    else if (e.key === "ArrowRight") { e.preventDefault(); lbShow(lbIdx + 1); }
    else if (e.key === "Tab") { e.preventDefault(); $("#lbClose").focus(); }
    return;
  }
  if (e.key === "ArrowLeft" && carImgs.length > 1) { e.preventDefault(); showCar(carIdx - 1); }
  if (e.key === "ArrowRight" && carImgs.length > 1) { e.preventDefault(); showCar(carIdx + 1); }
  if (e.key === "f" && carImgs.length) { openLightbox(stops[active], carIdx); }
  if (e.key === "ArrowDown" || e.key === "j") { e.preventDefault(); stopPlay(); setActive(active + 1, { scroll: true }); }
  if (e.key === "ArrowUp" || e.key === "k") { e.preventDefault(); stopPlay(); setActive(active - 1, { scroll: true }); }
});

/* ---------- Option switching ---------- */
function setOption(k, fromUser) {
  stopPlay();
  optKey = k;
  try { localStorage.setItem("trip-option", k); } catch (_) {}
  if (fromUser) { try { history.replaceState(null, "", "#" + k); } catch (_) {} }
  renderOpts();
  renderList();
  active = -1;
  if (narrowMQ.matches) scrollTo({ top: 0 }); else listEl.scrollTop = 0;
  setActive(0, { scroll: false });
}
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", render);
new MutationObserver(render).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme", "style"] });

/* ---------- Boot ---------- */
let start = "option2";
try { const saved = localStorage.getItem("trip-option"); if (saved && OPTIONS[saved]) start = saved; } catch (_) {}
const hash = (location.hash || "").slice(1);
if (OPTIONS[hash]) start = hash;
const r0 = mapwrap.getBoundingClientRect(); W = Math.max(50, r0.width); H = Math.max(50, r0.height);
overlay.setAttribute("viewBox", `0 0 ${W} ${H}`);
optKey = start;
renderOpts();
renderList();
active = 0;
view = viewForStop(0);
listEl.querySelector('.stop[data-i="0"]').classList.add("on");
renderPhotos(); renderLegInfo(); applyTod(stops[0]); render();
})();
</script>
